---
- name: Configure apt list changes
  ansible.builtin.copy:
    src: listchanges.conf
    dest: '/etc/apt/listchanges.conf'
  become: true

- name: Check for an existing policy-rc.d
  ansible.builtin.stat:
    path: /usr/sbin/policy-rc.d
  register: common_policy_rc_d
  tags:
    - install
    - update

- name: Check whether the existing policy-rc.d is managed by this role
  ansible.builtin.command:
    argv:
      - grep
      - -qF
      - 'Managed by centralesupelec.mydocker.common: defer docker restart'
      - /usr/sbin/policy-rc.d
  register: common_policy_rc_d_marker
  changed_when: false
  check_mode: false
  failed_when: common_policy_rc_d_marker.rc > 1
  when: common_policy_rc_d.stat.exists
  become: true
  tags:
    - install
    - update

- name: Refuse to overwrite a foreign policy-rc.d
  ansible.builtin.fail:
    msg: >-
      /usr/sbin/policy-rc.d already exists and is not managed by this role.
      Review it and merge the docker and containerd rules by hand, or remove it, then run again.
  when:
    - common_policy_rc_d.stat.exists
    - common_policy_rc_d_marker.rc != 0
  tags:
    - install
    - update

- name: Install policy-rc.d to defer docker and containerd restarts
  ansible.builtin.copy:
    src: policy-rc.d
    dest: /usr/sbin/policy-rc.d
    owner: root
    group: root
    mode: '0755'
  become: true
  tags:
    - install
    - update

- name: Create needrestart configuration directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags:
    - install
    - update

- name: Install needrestart docker drop-in
  ansible.builtin.copy:
    src: needrestart-docker.conf
    dest: /etc/needrestart/conf.d/docker.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  tags:
    - install
    - update

- name: Update and upgrade apt packages
  become: true
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
  tags:
    - install
    - update

- name: Install basic utilities
  ansible.builtin.apt:
    name:
      - man
      - vim
      - htop
      - git
      - zsh
      - screen
      - mosh
      - locate
      - apt-listchanges
      - locales
      - rsync
      - ncdu
      - traceroute
      - ldnsutils
      - lsof
      - silversearcher-ag
      - ncurses-term
      - fail2ban
      - gnupg
      - curl
      - unzip
    autoclean: true
    state: present
  tags:
    - install
    - update
  become: true

- name: Set timezone to Europe/Paris
  community.general.timezone:
    name: Europe/Paris
  tags:
    - install
    - timezone
  notify: Restart rsyslog
  become: true

- name: Generate locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop:
    - en_US.UTF-8
    - fr_FR.UTF-8
  tags:
    - install
  become: true

- name: Set shell to ZSH
  when: common_users is defined
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/zsh
  loop: "{{ common_users }}"
  tags:
    - install
    - zsh
  become: true

- name: Include homes configuration
  when: common_users is defined and (user_homes is undefined or item not in user_homes)
  ansible.builtin.include_tasks: homes.yml
  loop: "{{ common_users }}"

- name: ZSH configuration
  ansible.builtin.include_tasks: zsh.yml
  tags:
    - install
    - zsh

- name: Screen configuration for users
  when: common_users is defined
  ansible.builtin.copy:
    src: screenrc
    dest: "{{ user_homes[item] }}/.screenrc"
  tags:
    - install
    - screen
  loop: "{{ common_users }}"
  become: true

- name: Provision ssh keys
  when: (common_ssh_authorized_keys | default({}) | length > 0) and (item.value | default([]) | length > 0)
  ansible.posix.authorized_key:
    user: "{{ item.key }}"
    state: present
    key: "{{item.value | join('\n') if item.value is defined and item.value is iterable else ''}}"
    exclusive: true
  loop: "{{ (common_ssh_authorized_keys | default({})) | dict2items }}"
  become: true
  tags:
    - ssh
...
