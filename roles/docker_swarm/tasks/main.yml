---
- name: Install pip
  ansible.builtin.apt:
    name:
      - python3-pip
    autoclean: true
    update_cache: true
    state: present
  tags:
    - install
    - update

- name: Install docker module
  ansible.builtin.pip:
    name: docker
    version: ">=7.0.0, <8.0.0"
    extra_args: "{{ (ansible_python.version.minor > 10) | ternary('--break-system-packages', '') }}"
  tags:
    - install
    - update

- name: Create the Ceph configuration directory
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    mode: '0755'
  tags:
    - docker_install_plugin

# With an NFS source, nfs_mount.yml owns the root: a file task here would chmod the export on
# every run and hang on a dead mount.
- name: Create the FS backend root
  ansible.builtin.file:
    path: "{{ docker_swarm_volume_fs_root }}"
    state: directory
    mode: '0755'
  when: docker_swarm_volume_fs_nfs_source | length == 0
  tags:
    - docker_install_plugin

- name: Warn that the NFS source is ignored with the rbd backend
  ansible.builtin.debug:
    msg: >-
      docker_swarm_volume_fs_nfs_source is set but docker_swarm_volume_backend is
      "{{ docker_swarm_volume_backend }}"; nothing is mounted.
  when:
    - docker_swarm_volume_backend != "fs"
    - docker_swarm_volume_fs_nfs_source | length > 0
  tags:
    - docker_install_plugin

- name: Include Docker Swarm plugins tasks (centralesupelec/mydockervolume, ceph)
  ansible.builtin.import_tasks: ceph_plugin.yml
  when: 'docker_swarm_volume_backend == "rbd"'
  tags:
    - docker_install_plugin

- name: Include NFS mount tasks for the FS backend
  ansible.builtin.import_tasks: nfs_mount.yml
  when:
    - docker_swarm_volume_backend == "fs"
    - docker_swarm_volume_fs_nfs_source | length > 0
  tags:
    - docker_install_plugin

- name: Include Docker Swarm plugins tasks (centralesupelec/mydockervolume, ceph)
  ansible.builtin.import_tasks: local_volume_plugin.yml
  when: 'docker_swarm_volume_backend == "fs"'
  tags:
    - docker_install_plugin

- name: Include Docker Swarm init tasks
  ansible.builtin.import_tasks: docker_swarm_init.yml
  tags:
    - docker_swarm_init

- name: Include subnet fixing tasks
  ansible.builtin.include_tasks: fix_subnet.yml
  when: inventory_hostname in groups['docker_swarm_manager']
  tags:
    - docker_swarm_init

- name: Include seccomp tasks
  ansible.builtin.import_tasks: seccomp.yml
  tags:
    - docker_swarm_seccomp
