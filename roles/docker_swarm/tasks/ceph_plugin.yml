- name: Check if centralesupelec/mydockervolume plugin already installed
  ansible.builtin.command: "docker plugin inspect centralesupelec/mydockervolume -f '{{ '{{' }}.PluginReference{{ '}}' }}'"
  register: plugin_inspect
  changed_when: false
  # failed_when, not ignore_errors: see local_volume_plugin.yml. A missing plugin is the
  # expected probe result on a fresh host, not an error worth a red block.
  failed_when: false

- name: Define if should upgrade plugin
  changed_when: false
  set_fact:
    docker_swarm_volume_upgrade_internal: true
  when: (plugin_inspect.rc == 0) and (docker_swarm_volume_plugin != (plugin_inspect.stdout|replace("docker.io/", ""))) and docker_swarm_volume_upgrade

# Upgrade in place instead of rm -f + install: rm -f deletes the docker-side
# volume records served by the driver, and a live host must be drained first
# anyway (the driver has no unmount refcount, torn-away mounts stack rbd
# mappings that then fail to unmap).
- name: Disable centralesupelec/mydockervolume plugin before upgrade
  ansible.builtin.command: docker plugin disable -f centralesupelec/mydockervolume
  when: docker_swarm_volume_upgrade_internal
  register: output
  changed_when: output.rc == 0
  failed_when: false

- name: Upgrade centralesupelec/mydockervolume plugin in place
  ansible.builtin.command: >-
    docker plugin upgrade --skip-remote-check --grant-all-permissions
    centralesupelec/mydockervolume {{ docker_swarm_volume_plugin }}
  when: docker_swarm_volume_upgrade_internal

# docker plugin upgrade preserves the previous Settings and does not seed env
# vars that are new in the upgraded version's config, so set them explicitly
# (the plugin is still disabled here).
- name: Seed plugin settings the upgrade does not carry over
  ansible.builtin.command: docker plugin set centralesupelec/mydockervolume "{{ item }}"
  loop:
    - VOLUME_FSTYPE=ext4
    - VOLUME_MKFS_OPTIONS=-O mmp
    - VOLUME_SIZE=512
    - VOLUME_ORDER=22
    - SHELL_TIMEOUT_SECONDS=7
    - SHELL_RETRIES=3
    # A host carrying a blank RBD_CONF_DEVICE_MAP_ROOT overrides the driver's
    # /dev/rbd default with an empty string, and both create and mount then
    # resolve to the relative path <pool>/<image> instead of a device node.
    # That took the production worker out for four days (2026-08-31) in
    # silence. Declare the value so it does not depend on host state.
    - RBD_CONF_DEVICE_MAP_ROOT=/dev/rbd
  when: docker_swarm_volume_upgrade_internal

- name: Install docker centralesupelec/mydockervolume plugin
  ansible.builtin.command: >-
    docker plugin install {{ docker_swarm_volume_plugin }}
    --alias=centralesupelec/mydockervolume
    LOG_LEVEL=warning DRIVER_MODE=RBD
    RBD_CONF_POOL=mydocker-{{ env }} RBD_CONF_CLUSTER=ceph RBD_CONF_KEYRING_USER=client.{{ ceph_user }}
    RBD_CONF_DEVICE_MAP_ROOT=/dev/rbd
    VOLUME_FSTYPE=ext4 "VOLUME_MKFS_OPTIONS=-O mmp" VOLUME_SIZE=512 VOLUME_ORDER=22
    SHELL_TIMEOUT_SECONDS=7 SHELL_RETRIES=3
    --grant-all-permissions
  when: '"not found" in plugin_inspect.stderr'
  register: output
  changed_when: '"Installed plugin" in output.stdout'

# `docker plugin install` above enables the plugin with the daemon's default
# HTTP client timeout and offers no --timeout flag, so re-enable explicitly to
# set it. Also runs after an in-place upgrade, which leaves the plugin
# disabled. Otherwise the value already in place is left alone.
- name: Disable centralesupelec/mydockervolume plugin to set the enable timeout
  ansible.builtin.command: docker plugin disable -f centralesupelec/mydockervolume
  when: output.changed or docker_swarm_volume_upgrade_internal or docker_swarm_volume_force_enable_timeout
  register: output_timeout_disable
  changed_when: output_timeout_disable.rc == 0
  failed_when: false

- name: Enable centralesupelec/mydockervolume plugin with an explicit timeout
  ansible.builtin.command: >-
    docker plugin enable --timeout {{ docker_swarm_volume_enable_timeout }}
    centralesupelec/mydockervolume
  when: output.changed or docker_swarm_volume_upgrade_internal or docker_swarm_volume_force_enable_timeout
  register: output_timeout_enable
  changed_when: output_timeout_enable.rc == 0

- name: Get docker centralesupelec/mydockervolume plugin env configuration
  ansible.builtin.command: docker plugin inspect -f {{ '{{.Settings.Env}}' }} centralesupelec/mydockervolume
  changed_when: false
  register: rbd_env_list

- name: Disable centralesupelec/mydockervolume plugin to update conf
  ansible.builtin.command: docker plugin disable centralesupelec/mydockervolume -f
  when: ceph_user not in rbd_env_list.stdout
  register: output
  changed_when: output.rc == 0

- name: Update RBD_CONF_KEYRING_USER of centralesupelec/mydockervolume plugin
  ansible.builtin.command: docker plugin set centralesupelec/mydockervolume RBD_CONF_KEYRING_USER=client.{{ ceph_user }}
  when: ceph_user not in rbd_env_list.stdout
  register: output
  changed_when: output.rc == 0

- name: Update RBD_CONF_POOL of centralesupelec/mydockervolume plugin
  ansible.builtin.command: "docker plugin set centralesupelec/mydockervolume RBD_CONF_POOL=mydocker-{{ env }}"
  when: ceph_user not in rbd_env_list.stdout
  register: output
  changed_when: output.rc == 0

- name: Enable centralesupelec/mydockervolume plugin
  ansible.builtin.command: >-
    docker plugin enable --timeout {{ docker_swarm_volume_enable_timeout }}
    centralesupelec/mydockervolume
  when: ceph_user not in rbd_env_list.stdout
  register: output
  changed_when: output.rc == 0

- name: List installed plugins
  ansible.builtin.command: docker plugin list
  register: plugin_list
  changed_when: false

- name: Install docker cephfs plugin
  ansible.builtin.command: >-
    docker plugin install {{ cephfs_plugin }}
    --alias cephfs
    CLUSTER_NAME=ceph CLIENT_NAME={{ ceph_user }} SERVERS={{ ceph_ips | join(',') }}
    --grant-all-permissions
  register: output
  when: '"cephfs" not in plugin_list.stdout'
  changed_when: '"Installed plugin" in output.stdout'

- name: Get docker cephfs plugin env configuration
  ansible.builtin.command: docker plugin inspect -f {{ '{{.Settings.Env}}' }} cephfs
  changed_when: false
  register: cephfs_env_list

- name: Disable cepfs plugin to update conf
  ansible.builtin.command: docker plugin disable cephfs -f
  when: ceph_user not in cephfs_env_list.stdout
  register: output
  changed_when: output.rc == 0

- name: Update CLIENT_NAME of cephfs plugin
  ansible.builtin.command: "docker plugin set cephfs CLIENT_NAME={{ ceph_user }}"
  when: ceph_user not in cephfs_env_list.stdout
  register: output
  changed_when: output.rc == 0

- name: Enable cepfs plugin
  ansible.builtin.command: docker plugin enable cephfs
  when: ceph_user not in cephfs_env_list.stdout
  register: output
  changed_when: output.rc == 0
