- name: Check if centralesupelec/mydockervolume plugin already installed
  ansible.builtin.command: "docker plugin inspect centralesupelec/mydockervolume -f '{{ '{{' }}.PluginReference{{ '}}' }}'"
  register: plugin_inspect
  changed_when: false
  ignore_errors: true

- name: Define if should upgrade plugin
  changed_when: false
  set_fact:
    docker_swarm_volume_upgrade_internal: true
  when: (plugin_inspect.rc == 0) and (docker_swarm_volume_plugin != (plugin_inspect.stdout|replace("docker.io/", ""))) and docker_swarm_volume_upgrade

# Upgrade in place instead of rm -f + install: rm -f deletes the docker-side
# volume records served by the driver.
- name: Disable centralesupelec/mydockervolume plugin before upgrade
  ansible.builtin.command: docker plugin disable -f centralesupelec/mydockervolume
  when: docker_swarm_volume_upgrade_internal
  register: output
  changed_when: output.rc == 0
  failed_when: false

- name: Upgrade centralesupelec/mydockervolume plugin in place
  ansible.builtin.command: >-
    docker plugin upgrade --skip-remote-check --grant-all-permissions
    centralesupelec/mydockervolume {{ docker_swarm_volume_plugin }}
  when: docker_swarm_volume_upgrade_internal

# docker plugin upgrade preserves the previous Settings and does not seed env
# vars that are new in the upgraded version's config, so set them explicitly
# (the plugin is still disabled here).
- name: Seed plugin settings the upgrade does not carry over
  ansible.builtin.command: docker plugin set centralesupelec/mydockervolume "{{ item }}"
  loop:
    - SHELL_TIMEOUT_SECONDS=7
    - SHELL_RETRIES=3
    # Also re-asserted, not just seeded: the install task sets LOG_LEVEL=warning, but
    # `docker plugin upgrade` preserves whatever the host already had. A monolith
    # upgraded from a 2023 build on 2026-08-31 came through on LOG_LEVEL=debug, which
    # floods the docker journal via dockerd's stderr forwarding.
    - LOG_LEVEL=warning
  when: docker_swarm_volume_upgrade_internal

- name: Install docker centralesupelec/mydockervolume plugin
  ansible.builtin.command: >-
    docker plugin install {{ docker_swarm_volume_plugin }}
    --alias=centralesupelec/mydockervolume
    LOG_LEVEL=warning DRIVER_MODE=FS
    SHELL_TIMEOUT_SECONDS=7 SHELL_RETRIES=3
    --grant-all-permissions
  when: '"not found" in plugin_inspect.stderr'
  register: output
  changed_when: '"Installed plugin" in output.stdout'

# `docker plugin install` above enables the plugin with the daemon's default
# HTTP client timeout and offers no --timeout flag, so re-enable explicitly to
# set it. Also runs after an in-place upgrade, which leaves the plugin
# disabled. Otherwise the value already in place is left alone.
- name: Disable centralesupelec/mydockervolume plugin to set the enable timeout
  ansible.builtin.command: docker plugin disable -f centralesupelec/mydockervolume
  when: output.changed or docker_swarm_volume_upgrade_internal or docker_swarm_volume_force_enable_timeout
  register: output_timeout_disable
  changed_when: output_timeout_disable.rc == 0
  failed_when: false

# The marker must exist before the guard is armed, or the next Create fails on a
# marker that was never created. Touched on the host path bound in as the plugin
# root, so an unmounted store means an absent marker, which is the whole point.
- name: Create the FS backing-store marker
  ansible.builtin.file:
    path: "{{ docker_swarm_volume_fs_root }}/{{ docker_swarm_volume_fs_ready_marker }}"
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  when: docker_swarm_volume_fs_ready_marker | length > 0

# Set inside the same disabled window as the enable-timeout tasks: `docker plugin set`
# refuses to run against an enabled plugin, and in steady state it is enabled.
- name: Arm the FS backing-store guard
  ansible.builtin.command: >-
    docker plugin set centralesupelec/mydockervolume
    "FS_READY_MARKER={{ docker_swarm_volume_fs_ready_marker }}"
  when:
    - docker_swarm_volume_fs_ready_marker | length > 0
    - output.changed or docker_swarm_volume_upgrade_internal or (docker_swarm_volume_force_enable_timeout | bool)
  register: output_marker
  changed_when: output_marker.rc == 0

- name: Enable centralesupelec/mydockervolume plugin with an explicit timeout
  ansible.builtin.command: >-
    docker plugin enable --timeout {{ docker_swarm_volume_enable_timeout }}
    centralesupelec/mydockervolume
  when: output.changed or docker_swarm_volume_upgrade_internal or docker_swarm_volume_force_enable_timeout
  register: output_timeout_enable
  changed_when: output_timeout_enable.rc == 0
