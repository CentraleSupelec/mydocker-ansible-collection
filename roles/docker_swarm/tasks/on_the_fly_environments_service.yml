---
# The volume must be attached through the mydockervolume driver, not the default
# local driver: student environments mount the same volume through that driver, so
# a local-driver mount here would write to a different directory and the shared
# content would silently never appear in the environments.
- name: Create on the fly environments service
  docker_swarm_service:
    name: on_the_fly_environments
    image: "{{ on_the_fly_environments_image }}"
    replicas: 1
    networks:
      - name: "{{ caddy_overlay_network }}"
    mounts:
      - source: "{{ on_the_fly_environments_source }}"
        target: "{{ on_the_fly_environments_target }}"
        type: volume
        driver_config:
          name: centralesupelec/mydockervolume
    restart_config:
      condition: any
    placement:
      constraints:
        - node.hostname == {{ groups['docker_swarm_manager'][0] }}
