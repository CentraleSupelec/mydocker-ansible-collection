# rbd OR fs. Derived from enable_ceph so the historical behaviour is unchanged
# for inventories that never set it, but living in defaults/ instead of a role
# `vars:` entry means an inventory can now actually override it. As a role var
# it outranked group_vars, so a `docker_swarm_volume_backend: fs` in an
# inventory silently did nothing (found on the VD repos, 2026-08-31).
docker_swarm_volume_backend: "{{ enable_ceph | default(false) | ternary('rbd', 'fs') }}"
docker_swarm_volume_plugin: centralesupelec/mydockervolume:latest
cephfs_plugin: brindster/docker-plugin-cephfs
docker_swarm_volume_upgrade: false
# HTTP client timeout dockerd applies to every volume driver call. `docker
# plugin install` enables the plugin itself and has no --timeout flag, so a
# host installed without an explicit enable inherits the daemon default, which
# survives daemon restarts. Measured on preprod: under the default, 33 of 100
# concurrent volume creates failed while the volumes were in fact created.
docker_swarm_volume_enable_timeout: 120
# Set true for one run to re-enable the plugin with the timeout above on hosts
# that already have it installed. There is no way to read the current value
# back, so this cannot be made conditional; it briefly interrupts volume
# operations on every targeted host.
docker_swarm_volume_force_enable_timeout: false
# FS mode only. Empty = guard off, which is 1.3.x behaviour. Set to a filename to make
# the plugin refuse Create and Mount unless that marker is readable under its root, so a
# backing store that is not mounted fails loudly instead of silently accepting work into
# a directory that vanishes when the store returns. Rehearsed on the VD test hosts
# (NFS export) 2026-08-31: with the export unmounted, Create fails with "backing store
# not ready". Matters most where the root is a network mount.
docker_swarm_volume_fs_ready_marker: ""
# Host path bound into the plugin as its volume root; where the marker file is created.
docker_swarm_volume_fs_root: /mnt/mydocker-fs
docker_swarm_port: 2377
docker_swarm_seccomp_folder: /opt/docker-seccomp
docker_swarm_seccomp_override: false
docker_swarm_subnet: 10.0.0.0/8
docker_swarm_unpublish_services: false # if "true" and network editing fails, you will have to manually republish service ports. If false and there are existing services, network editing is not attempted.
docker_swarm_subnet_gateway: ~
ceph_user: ~
ceph_ips: ~
env: ~
ceph_pool: mydocker-{{ env }}
# gpu_type: ~
# owner: ~
registry_address: ~
registry_username: ~
registry_password: ~
caddy_overlay_network: caddy-overlay
caddy_cert_file_source_path: "{{ undef(hint='caddy_cert_file_source_path must be defined') }}"
caddy_key_file_source_path: "{{ undef(hint='caddy_key_file_source_path must be defined') }}"
caddy_cert_file_target_path: /etc/ssl/caddy_reverse_proxy/cert.pem
caddy_key_file_target_path: /etc/ssl/caddy_reverse_proxy/key.pem
caddy_overlay_network_subnet: 192.168.0.0/18
caddy_controller_network: caddy-controller
caddy_controller_network_subnet: 192.168.64.0/25
caddy_polling_interval: 5s
caddy_event_throttle_interval: 1m
caddy_process_caddyfile: false
caddy_lock_update: false
caddy_monitor_events: true
proxy_aristote_dispatcher: ~
aristote_dispatcher_tls_internal: ~
aristote_dispatcher_url: ~
aristote_dispatcher_token: ~
aristote_dispatcher_alias: ~
caddy_docker_proxy_image: "lucaslorentz/caddy-docker-proxy:2.9.2-alpine"

# On-the-fly environments API: writes into the volume that every student
# environment mounts read-only via the docker_api role's volume_mounts.
# Leave the image unset to skip creating the service entirely.
on_the_fly_environments_image: ~
on_the_fly_environments_source: shared
on_the_fly_environments_target: /cache
